<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Kanso Studio — 17-Language Interactive Code Playground</title>
    <script>
      window.addEventListener(
        'error',
        function (e) {
          if (e && typeof e.filename === 'string' && e.filename.indexOf('chrome-extension://') === 0) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        },
        true
      );
      try {
        if (localStorage.getItem('kanso-theme') === 'dark') {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Minimalist 17-language interactive code editor and live execution studio with 3D reactive panels and custom coding cursor."
    />
    <meta property="og:title" content="Kanso Studio — 17-Language Interactive Code Playground" />
    <meta
      property="og:description"
      content="Minimalist 17-language interactive code editor and live execution studio with 3D reactive panels and custom coding cursor."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
